name: Try fdroid/build.sh in Debian

# Runs the fdroiddata recipe in fdroid/metadata the way F-Droid's build server
# would: a debian:trixie container, the recipe's sudo: commands as root, the
# NDK from sdkmanager, then fdroid/build.sh prebuild and build as an
# unprivileged user, with fdroidserver's scanner in between.
#
# F-Droid runs build once; GitHub's jobs stop after 6 hours, so here build is
# relayed over up to six jobs (fdroid-build-stage.yml): each stops ninja
# before the limit and hands the whole workspace to the next, whose build
# continues where ninja stopped. To save time, stage 1 takes the toolchain and
# the tools built from source from earlier runs (the same scripts built them).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chromium 版本（要有 reports/<version>/prune-list.txt）"
        required: false
        default: "158.0.8127.36"
        type: string
      cpu:
        description: "arm、arm64 或 x64"
        required: false
        default: "arm64"
        type: string
      toolchain_from:
        description: "工具鏈 artifact（chromium-tc-*）的 run，空白分隔 owner/repo/run_id，後面的蓋過前面的"
        required: false
        default: "AcideFluorhydrique/chromium-fdroid/44875838806"
        type: string
      tools_from:
        description: "tools-from-source 的 run（tool-* artifact）"
        required: false
        default: "AcideFluorhydrique/chromium-fdroid/44573113946"
        type: string
      scan:
        description: "prebuild 之後跑 fdroidserver 的 scanner"
        required: false
        default: true
        type: boolean
      ninja_minutes:
        description: "測試交棒用：每一棒的 ninja 只跑這麼多分鐘（空白 = 跑到期限）"
        required: false
        default: ""
        type: string
      dry_run:
        description: "測試用：configure 完只跑 ninja -n（檢查編譯需要的檔案都在）就結束，不編譯"
        required: false
        default: false
        type: boolean
      resume_from:
        description: "接著另一個 run 沒編完的工作目錄：owner/repo/run_id/fdroid-recipe-work-N（空白 = 從頭開始）"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  stage1:
    uses: ./.github/workflows/fdroid-build-stage.yml
    with:
      stage: 1
      version: ${{ inputs.version }}
      cpu: ${{ inputs.cpu }}
      toolchain_from: ${{ inputs.toolchain_from }}
      tools_from: ${{ inputs.tools_from }}
      scan: ${{ inputs.scan }}
      ninja_minutes: ${{ inputs.ninja_minutes }}
      resume_from: ${{ inputs.resume_from }}
      dry_run: ${{ inputs.dry_run }}

  stage2:
    needs: stage1
    if: needs.stage1.outputs.done == 'false'
    uses: ./.github/workflows/fdroid-build-stage.yml
    with:
      stage: 2
      version: ${{ inputs.version }}
      cpu: ${{ inputs.cpu }}
      ninja_minutes: ${{ inputs.ninja_minutes }}

  stage3:
    needs: stage2
    if: needs.stage2.outputs.done == 'false'
    uses: ./.github/workflows/fdroid-build-stage.yml
    with:
      stage: 3
      version: ${{ inputs.version }}
      cpu: ${{ inputs.cpu }}
      ninja_minutes: ${{ inputs.ninja_minutes }}

  stage4:
    needs: stage3
    if: needs.stage3.outputs.done == 'false'
    uses: ./.github/workflows/fdroid-build-stage.yml
    with:
      stage: 4
      version: ${{ inputs.version }}
      cpu: ${{ inputs.cpu }}
      ninja_minutes: ${{ inputs.ninja_minutes }}

  stage5:
    needs: stage4
    if: needs.stage4.outputs.done == 'false'
    uses: ./.github/workflows/fdroid-build-stage.yml
    with:
      stage: 5
      version: ${{ inputs.version }}
      cpu: ${{ inputs.cpu }}
      ninja_minutes: ${{ inputs.ninja_minutes }}

  stage6:
    needs: stage5
    if: needs.stage5.outputs.done == 'false'
    uses: ./.github/workflows/fdroid-build-stage.yml
    with:
      stage: 6
      version: ${{ inputs.version }}
      cpu: ${{ inputs.cpu }}
      ninja_minutes: ${{ inputs.ninja_minutes }}
