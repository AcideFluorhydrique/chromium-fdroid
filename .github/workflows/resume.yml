name: Resume a Chromium build from another run

# 一次完整的編譯要 12 小時以上。如果只是最後幾步壞掉（R8、打包），或只改了少數檔案，
# 不用重頭來：從那個 run 的 chromium-src 和某一棒的 out/ artifact 接著編，
# 用 fixup 改掉 src 裡有問題的檔案，ninja 只會重做受影響的步驟。
# artifact 只保留 3 天。

on:
  workflow_dispatch:
    inputs:
      from_run:
        description: "要接著編的 run id（build.yml 或 resume.yml 的 run）"
        required: true
        type: string
      out_name:
        description: "從哪個 out/ artifact 開始，例如 chromium-out-2"
        required: true
        type: string
      version:
        description: "那個 run 的 Chromium 版本（只用在 APK artifact 的名字）"
        required: true
        type: string
      target_cpu:
        description: "那個 run 的 CPU 架構"
        required: true
        default: "arm64"
        type: string
      fixup:
        description: "ninja 之前在 workspace 執行的 bash，例如 sed -i ... src/fdroid_gms/microg-proguard.txt"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  # stage 編號從 11 開始，out/ artifact 才不會和原本 run 的 chromium-out-N 混在一起
  stage11:
    uses: ./.github/workflows/stage.yml
    with:
      stage: 11
      version: ${{ inputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: unused
      src_run: ${{ inputs.from_run }}
      out_run: ${{ inputs.from_run }}
      out_name: ${{ inputs.out_name }}
      fixup: ${{ inputs.fixup }}

  stage12:
    needs: stage11
    if: ${{ !cancelled() && needs.stage11.result == 'success' && needs.stage11.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 12
      version: ${{ inputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: unused
      src_run: ${{ inputs.from_run }}
      fixup: ${{ inputs.fixup }}

  stage13:
    needs: stage12
    if: ${{ !cancelled() && needs.stage12.result == 'success' && needs.stage12.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 13
      last_stage: true
      version: ${{ inputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: unused
      src_run: ${{ inputs.from_run }}
      fixup: ${{ inputs.fixup }}
