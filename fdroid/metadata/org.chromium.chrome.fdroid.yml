MaintainerNotes: |-
  Vanilla Chromium with only the changes F-Droid's inclusion policy needs
  (fdroiddata#3911): androidx releases from Google Maven, microG in place of
  Play services, signature-only stubs for the remaining Google libraries,
  Play Core / ML Kit / Impress removed, a few small patches. Everything is
  done by fdroid/build.sh in the Repo, which the GitHub Actions builds of that
  repository run too:

  prebuild: chromium/src at the version tag; gclient sync without the
  DEPS chrome_public_apk does not need (fdroid/skip-deps.txt); deletes the
  flagged files the build never reads (fdroid/prune_binaries.py with
  reports/<version>/prune-list.txt.gz, generated from the scanner findings
  and the chrome_public_apk build graph); Debian's Python; the NDK given by
  the recipe.

  build: clang, Rust, GN, Ninja and Node built from source with Debian's
  compilers; gperf, esbuild, tsc, rollup's wasm and Dawn's Go built from
  source; r8, turbine, aapt2, protoc and kotlinc from Google Maven / Maven
  Central; then gn gen, ninja and an unsigned copy of the APK
  (fdroid/unsign_apk.py; Chromium signs it with its debug key).

  The build takes about 20 hours on 4 cores.

  Version codes are Chromium's own (build/util/android_chrome_version.py):
  BUILD * 100000 + PATCH * 100 + ABI digit, ABI 00 = arm, 04 = arm64,
  09 = x64. Example: 158.0.8127.36 arm64 = 812703604.

  New versions: https://chromiumdash.appspot.com/releases?platform=Android
  (Stable). The Repo needs reports/<version>/prune-list.txt.gz for each
  version (its scan.yml workflow writes it).

  NDK version: grep android_ndk_version src/DEPS

  Scanner: microG's com.google.android.gms classes and the stubs in
  fdroid/stubs are expected (they replace Play services).

