name: Sync without dev-only DEPS

# 用 fdroid/skip-deps.txt 讓 gclient sync 不下載測試、benchmark、開發工具用的 DEPS（fdroid/skip_deps.py 從 src/DEPS 刪掉），
# 再檢查 chrome_public_apk 的編譯圖：每個輸入檔都還在，就代表這些 DEPS 可以不同步。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chromium 版本 tag（留空 = 最新 Android Stable）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v=$(curl -fsSL "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1" | jq -r '.[0].version')
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本格式不對: '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Chromium $v"

      # 新版 runner 映像只有一顆碟，清掉用不到的東西，根目錄約有 110GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: |
            .github/scripts
            fdroid

      - name: Get depot_tools
        run: |
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch chromium/src at tag
        run: |
          git init -q src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          for i in 1 2 3 4; do git fetch -q --depth 1 origin "refs/tags/$VERSION" && break; echo "fetch 失敗，$((i * 60)) 秒後重試 ($i/4)"; sleep $((i * 60)); done
          git checkout -q FETCH_HEAD

      - name: gclient sync
        run: |
          # custom_deps = None 只跳過 git 的 DEPS（gclient 把 CIPD 的 dep 叫做 "路徑:套件"，對不上），
          # 所以直接從 src/DEPS 刪掉這些條目
          python3 -I ci/fdroid/skip_deps.py src/DEPS ci/fdroid/skip-deps.txt
          cat > .gclient <<'GCLIENT'
          solutions = [{
            "name": "src",
            "url": "https://chromium.googlesource.com/chromium/src.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {},
          }]
          target_os = ["android"]
          GCLIENT
          gclient sync --no-history -j 8
          # third_party/cpython3/host 也在 skip-deps 裡：GN 用系統的 Python（和 fdroid/build.sh 一樣）
          mkdir -p src/third_party/cpython3/host/bin
          ln -sfn "$(command -v python3)" src/third_party/cpython3/host/bin/python3
          du -sh src

      # 用 chrome_public_apk 的編譯圖（不編譯）判斷哪些被標記的檔案真的會被編譯用到
      - name: Install build deps
        run: sudo src/build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts --no-syms --no-arm --no-nacl

      - name: Check the build graph
        run: |
          mkdir -p src/out/Default
          cat > src/out/Default/args.gn <<'ARGS'
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_component_build = false
          symbol_level = 0
          treat_warnings_as_errors = false
          android_static_analysis = "off"
          use_siso = false
          ARGS
          (cd src && buildtools/linux64/gn gen out/Default) 2>&1 | tee gn.log
          src/third_party/ninja/ninja -C src/out/Default -t inputs chrome_public_apk > build-inputs.txt
          missing=$(cd src/out/Default && while read -r f; do case "$f" in ../../*) [ -e "$f" ] || echo "${f#../../}";; esac; done < ../../../build-inputs.txt)
          n=$(printf '%s' "$missing" | grep -c . || true)
          # -t inputs leaves out validations (Error Prone runs as one), a dry run checks them too
          dry=ok
          src/third_party/ninja/ninja -C src/out/Default -n chrome_public_apk > /dev/null 2> ninja-n.log || dry=FAILED
          {
            echo "## Sync without dev-only DEPS ($VERSION)"
            echo
            echo "Skipped $(grep -vc '^#' ci/fdroid/skip-deps.txt) DEPS entries listed in fdroid/skip-deps.txt."
            echo
            echo "- synced src size: $(du -sh src | cut -f1)"
            echo "- gn gen: $(grep -q '^Done' gn.log && echo ok || echo FAILED)"
            echo "- chrome_public_apk build inputs: $(wc -l < build-inputs.txt), missing on disk: $n"
            if [ "$n" -gt 0 ]; then echo; echo '```'; printf '%s\n' "$missing" | head -50; echo '```'; fi
            echo "- ninja -n chrome_public_apk (validations included): $dry"
            if [ "$dry" != ok ]; then echo; echo '```'; head -20 ninja-n.log; echo '```'; fi
          } | tee sync-trim.md >> "$GITHUB_STEP_SUMMARY"
          grep -q '^Done' gn.log && [ "$dry" = ok ]

      # fdroid/build.sh rebuilds these CIPD packages from Maven: record what they hold
      - name: Record the CIPD packages build replaces
        run: python3 -I ci/.github/scripts/record_cipd.py src cipd-pins.json

      - name: Commit report
        if: always()
        run: |
          [ -f sync-trim.md ] || exit 0
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          d="repo/reports/$VERSION"
          mkdir -p "$d"
          cp sync-trim.md "$d/sync-trim.md"
          [ -f cipd-pins.json ] && cp cipd-pins.json "$d/cipd-pins.json"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -q -m "Add sync-without-dev-DEPS report for Chromium $VERSION" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
