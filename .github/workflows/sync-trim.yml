name: Sync without dev-only DEPS

# 用 fdroid/skip-deps.txt 讓 gclient sync 不下載測試、benchmark、開發工具用的 DEPS（custom_deps = None），
# 再檢查 chrome_public_apk 的編譯圖：每個輸入檔都還在，就代表這些 DEPS 可以不同步。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chromium 版本 tag（留空 = 最新 Android Stable）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v=$(curl -fsSL "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1" | jq -r '.[0].version')
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本格式不對: '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Chromium $v"

      # 新版 runner 映像只有一顆碟，清掉用不到的東西，根目錄約有 110GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: |
            .github/scripts
            fdroid

      - name: Get depot_tools
        run: |
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch chromium/src at tag
        run: |
          git init -q src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          for i in 1 2 3 4; do git fetch -q --depth 1 origin "refs/tags/$VERSION" && break; echo "fetch 失敗，$((i * 60)) 秒後重試 ($i/4)"; sleep $((i * 60)); done
          git checkout -q FETCH_HEAD

      - name: gclient sync
        run: |
          deps=$(grep -v '^#' ci/fdroid/skip-deps.txt | grep . | sed 's/.*/"&": None,/' | tr '\n' ' ')
          cat > .gclient <<'GCLIENT'
          solutions = [{
            "name": "src",
            "url": "https://chromium.googlesource.com/chromium/src.git",
            "managed": False,
            "custom_deps": CUSTOM_DEPS,
            "custom_vars": {},
          }]
          target_os = ["android"]
          GCLIENT
          sed -i "s|CUSTOM_DEPS|{ $deps }|" .gclient
          cat .gclient
          gclient sync --no-history -j 8
          du -sh src

      # 用 chrome_public_apk 的編譯圖（不編譯）判斷哪些被標記的檔案真的會被編譯用到
      - name: Install build deps
        run: sudo src/build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts --no-syms --no-arm --no-nacl

      - name: Check the build graph
        run: |
          mkdir -p src/out/Default
          cat > src/out/Default/args.gn <<'ARGS'
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_component_build = false
          symbol_level = 0
          treat_warnings_as_errors = false
          android_static_analysis = "off"
          use_siso = false
          ARGS
          (cd src && buildtools/linux64/gn gen out/Default) 2>&1 | tee gn.log
          src/third_party/ninja/ninja -C src/out/Default -t inputs chrome_public_apk > build-inputs.txt
          missing=$(cd src/out/Default && while read -r f; do case "$f" in ../../*) [ -e "$f" ] || echo "${f#../../}";; esac; done < ../../../build-inputs.txt)
          n=$(printf '%s' "$missing" | grep -c . || true)
          {
            echo "## Sync without dev-only DEPS ($VERSION)"
            echo
            echo "Skipped $(grep -vc '^#' ci/fdroid/skip-deps.txt) DEPS entries listed in fdroid/skip-deps.txt."
            echo
            echo "- synced src size: $(du -sh src | cut -f1)"
            echo "- gn gen: $(grep -q '^Done' gn.log && echo ok || echo FAILED)"
            echo "- chrome_public_apk build inputs: $(wc -l < build-inputs.txt), missing on disk: $n"
            if [ "$n" -gt 0 ]; then echo; echo '```'; printf '%s\n' "$missing" | head -50; echo '```'; fi
          } | tee sync-trim.md >> "$GITHUB_STEP_SUMMARY"
          grep -q '^Done' gn.log

      - name: Commit report
        if: always()
        run: |
          [ -f sync-trim.md ] || exit 0
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          d="repo/reports/$VERSION"
          mkdir -p "$d"
          cp sync-trim.md "$d/sync-trim.md"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -q -m "Add sync-without-dev-DEPS report for Chromium $VERSION" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
