name: Chromium Android stage (F-Droid tests)

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      last_stage:
        type: boolean
        default: false
      version:
        type: string
        required: true
      target_cpu:
        type: string
        required: true
      package_name:
        type: string
        required: true
      official:
        type: boolean
        default: false
      own_toolchain:
        type: boolean
        default: false
      toolchain_from:
        type: string
        default: ""
      rebuild_only:
        type: string
        default: ""
      variant:
        type: string
        default: ""
      # F-Droid 的原始碼處理：不同步 fdroid/skip-deps.txt 的 DEPS、用 prune_binaries.py 刪掉
      # 編譯不會讀的被標記檔案、NDK 改用 sdkmanager（F-Droid 編譯伺服器也是這樣拿 NDK）
      fdroid_tree:
        type: boolean
        default: false
      # tools-from-source.yml 的 run（owner/repo/run_id）：tsc、esbuild、gperf、rollup 的 wasm 換成從原始碼編的
      tools_from:
        type: string
        default: ""
      gn_args:
        description: "額外的 GN args，接在 args.gn 最後（只有 stage 1 用得到）"
        type: string
        default: ""
      # build.yml 的 resume_from：從別的 run 的 artifact 接著編（stage > 1 才有用）
      src_run:
        description: "chromium-src 從哪個 run 下載（留空 = 這次 run）"
        type: string
        default: ""
      out_run:
        description: "上一棒的 out/ 從哪個 run 下載（留空 = 這次 run）"
        type: string
        default: ""
      out_name:
        description: "上一棒 out/ 的 artifact 名稱（留空 = chromium-out-<stage-1>）"
        type: string
        default: ""
      fixup:
        description: "還原之後、ninja 之前在 workspace 執行的 bash（改 src 裡的檔案；每一棒都要重跑，因為 src artifact 不會更新）"
        type: string
        default: ""
    outputs:
      done:
        value: ${{ jobs.build.outputs.done }}

jobs:
  build:
    name: stage ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    outputs:
      done: ${{ steps.build.outputs.done }}

    env:
      STAGE: ${{ inputs.stage }}
      VERSION: ${{ inputs.version }}
      TARGET_CPU: ${{ inputs.target_cpu }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      OFFICIAL: ${{ inputs.official }}
      OWN_TOOLCHAIN: ${{ inputs.own_toolchain }}
      # job 開始後第幾分鐘一定要停 ninja（6 小時上限，扣掉打包、上傳的時間）
      NINJA_DEADLINE_MIN: 320

    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # 舊版 runner 映像：根目錄和 /mnt 是兩顆碟，要用 maximize-build-space 合併成一個約 100GB 的卷。
      # 新版映像：只有一顆 145GB 的碟，/mnt 只是根目錄底下的資料夾。這時 maximize-build-space
      # 會把同一顆碟算兩次，根目錄被吃到只剩 100MB、apt 寫不進去，所以改成直接清根目錄。
      - name: Check disk layout
        id: disk
        run: |
          df -h / /mnt
          if [ "$(stat -c %d /)" != "$(stat -c %d /mnt)" ]; then sep=true; else sep=false; fi
          echo "/mnt 是獨立的碟: $sep"
          echo "separate_mnt=$sep" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.disk.outputs.separate_mnt != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          [ "$avail" -ge 90 ] || echo "::warning::根目錄只剩 ${avail}GB，可能不夠"

      - name: Maximize disk space
        if: steps.disk.outputs.separate_mnt == 'true'
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 20480
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      # 用 maximize-build-space 時根目錄只剩約 20GB，暫存檔和 vpython / CIPD / uv 快取全部改放到 workspace
      - name: Move temp and caches to build volume
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp" "$GITHUB_WORKSPACE/.cache"
          # 有些工具（例如 vpython 底下的 uv）不理 TMPDIR，直接把 /tmp 掛到大卷
          sudo chmod 1777 "$GITHUB_WORKSPACE/.tmp"
          sudo mount --bind "$GITHUB_WORKSPACE/.tmp" /tmp
          {
            echo "TMPDIR=$GITHUB_WORKSPACE/.tmp"
            echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/.cache"
            echo "VPYTHON_VIRTUALENV_ROOT=$GITHUB_WORKSPACE/.cache/vpython-root"
            echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/.cache/uv"
            echo "CIPD_CACHE_DIR=$GITHUB_WORKSPACE/.cache/cipd"
          } >> "$GITHUB_ENV"

      # 官方編譯的 ThinLTO 連結 libchrome.so 約需 20GB 記憶體，runner 只有 16GB，在大卷上補一個 16GB swap
      - name: Extra swap for ThinLTO link
        if: inputs.official
        run: |
          sudo fallocate -l 16G "$GITHUB_WORKSPACE/.swapfile"
          sudo chmod 600 "$GITHUB_WORKSPACE/.swapfile"
          sudo mkswap "$GITHUB_WORKSPACE/.swapfile"
          sudo swapon "$GITHUB_WORKSPACE/.swapfile"
          free -h

      - name: Show disk
        run: df -h

      - name: Checkout ci scripts
        if: inputs.stage == 1 && (inputs.own_toolchain || inputs.variant != '' || inputs.fdroid_tree || inputs.tools_from != '')
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: |
            .github/scripts
            fdroid
            reports

      # ---------- stage 1：抓原始碼 ----------

      - name: Get depot_tools
        if: inputs.stage == 1
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch chromium/src at tag
        if: inputs.stage == 1
        run: |
          git init src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          for i in 1 2 3 4; do git fetch -q --depth 1 origin "refs/tags/$VERSION" && break; echo "fetch 失敗，$((i * 60)) 秒後重試 ($i/4)"; sleep $((i * 60)); done
          git checkout --quiet FETCH_HEAD
          git log -1 --format='%H %cd %s'

      - name: Install build deps
        if: inputs.stage == 1
        run: sudo src/build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts --no-syms --no-arm --no-nacl

      # src 已經手動 checkout 到指定 tag，設成 unmanaged 讓 gclient 只同步 DEPS
      - name: gclient sync
        if: inputs.stage == 1
        env:
          FDROID_TREE: ${{ inputs.fdroid_tree }}
        run: |
          PGO=False
          [ "$OFFICIAL" = "true" ] && PGO=True
          DEPS_SKIP=""
          if [ "$FDROID_TREE" = "true" ]; then
            DEPS_SKIP=$(grep -v '^#' ci/fdroid/skip-deps.txt | grep . | sed 's/.*/"&": None,/' | tr '\n' ' ')
          fi
          cat > .gclient <<GCLIENT
          solutions = [{
            "name": "src",
            "url": "https://chromium.googlesource.com/chromium/src.git",
            "managed": False,
            "custom_deps": {$DEPS_SKIP},
            "custom_vars": {"checkout_pgo_profiles": $PGO},
          }]
          target_os = ["android"]
          GCLIENT
          gclient sync --no-history -j 8
          du -sh src

      - name: F-Droid tree (prune, NDK from sdkmanager)
        if: inputs.stage == 1 && inputs.fdroid_tree
        run: |
          list=ci/reports/$VERSION/prune-list.txt.gz
          [ -f "$list" ] || { echo "no $list: run scan.yml for $VERSION first"; exit 1; }
          python3 -I ci/fdroid/prune_binaries.py src "$list"
          # GN 和所有 build 腳本都用 third_party/cpython3/host/bin/python3 執行，它不是 ninja 的
          # input，所以會被 prune 掉；F-Droid 編譯時本來就該用系統（Debian）的 Python
          rm -rf src/third_party/cpython3/host
          mkdir -p src/third_party/cpython3/host/bin
          ln -s "$(command -v python3)" src/third_party/cpython3/host/bin/python3
          src/third_party/cpython3/host/bin/python3 --version
          ndk=$(grep -oP "'android_ndk_version': Str\('\d+@\K[0-9.]+" src/DEPS)
          echo "NDK $ndk from sdkmanager"
          pip install --quiet --break-system-packages sdkmanager
          export ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk
          mkdir -p "$ANDROID_HOME"
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$ndk"
          rm -rf src/third_party/android_toolchain/ndk
          # 後面要打包進 chromium-src，所以複製進來，不用 symlink
          cp -a "$ANDROID_HOME/ndk/$ndk" src/third_party/android_toolchain/ndk
          rm -rf "$ANDROID_HOME"
          grep Pkg.Revision src/third_party/android_toolchain/ndk/source.properties
          du -sh src

      # toolchain.yml 自己從原始碼編的 clang / rust / gn / ninja / node
      # toolchain_from 可以填好幾個 run（空白或逗號分隔），依序下載，後面的蓋過前面的同名檔案，
      # 例如 clang/tools 取一個 run、rust 取另一個 run
      - name: Download own toolchain from other runs
        if: inputs.stage == 1 && inputs.own_toolchain && inputs.toolchain_from != ''
        env:
          FROM: ${{ inputs.toolchain_from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tc
          i=0
          for src in ${FROM//,/ }; do
            [[ "$src" =~ ^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/([0-9]+)$ ]] || { echo "toolchain_from 格式要是 owner/repo/run_id: '$src'"; exit 1; }
            i=$((i + 1))
            echo "下載 $src"
            gh run download "${BASH_REMATCH[2]}" -R "${BASH_REMATCH[1]}" -p 'chromium-tc-*' -D "tc-dl/$i"
            find "tc-dl/$i" -name '*.tar.zst' -exec mv -f -t tc {} +
          done
          rm -rf tc-dl
          ls -lh tc

      # 這次 run 自己編的部分最後下載，蓋過 toolchain_from 的同名檔案
      - name: Download own toolchain
        if: inputs.stage == 1 && inputs.own_toolchain && (inputs.toolchain_from == '' || inputs.rebuild_only != '')
        uses: actions/download-artifact@v4
        with:
          pattern: chromium-tc-*
          path: tc
          merge-multiple: true

      - name: Swap in own toolchain
        if: inputs.stage == 1 && inputs.own_toolchain
        run: python3 ci/.github/scripts/swap_toolchain.py src tc

      - name: Swap in tools built from source
        if: inputs.stage == 1 && inputs.tools_from != ''
        env:
          FROM: ${{ inputs.tools_from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$FROM" =~ ^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/([0-9]+)$ ]] || { echo "tools_from 格式要是 owner/repo/run_id: '$FROM'"; exit 1; }
          gh run download "${BASH_REMATCH[2]}" -R "${BASH_REMATCH[1]}" -p 'tool-*' -D tools-dl
          mkdir -p tools && find tools-dl -type f -exec mv -t tools {} +
          rm -rf tools-dl && ls -la tools
          python3 -I ci/.github/scripts/swap_tools.py src tools
          rm -rf tools

      # gms_variant.py：換掉不自由的 Java 函式庫（microG、stub、補丁），見 java.yml
      - name: Apply variant
        if: inputs.stage == 1 && inputs.variant != ''
        env:
          VARIANT: ${{ inputs.variant }}
        run: python3 ci/.github/scripts/gms_variant.py src "$VARIANT" | tee variant.gn

      - name: gn gen
        if: inputs.stage == 1
        env:
          GN_ARGS: ${{ inputs.gn_args }}
        run: |
          mkdir -p src/out/Default
          cat > src/out/Default/args.gn <<ARGS
          target_os = "android"
          target_cpu = "$TARGET_CPU"
          is_debug = false
          is_component_build = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          treat_warnings_as_errors = false
          android_static_analysis = "off"
          use_siso = false
          # 非 official 的 release 預設 dcheck_always_on = true（build/config/dcheck_always_on.gni），
          # DCHECK 失敗會直接 crash，也比較慢、比較大；official 時本來就是 false
          dcheck_always_on = false
          chrome_public_manifest_package = "$PACKAGE_NAME"
          ARGS
          # 照 uazo/cromite 的 build/chromium.gn_args（Vanilla Chromium）
          if [ "$OFFICIAL" = "true" ]; then
            cat >> src/out/Default/args.gn <<ARGS
          is_official_build = true
          include_both_v8_snapshots = false
          ARGS
          fi
          [ -f variant.gn ] && cat variant.gn >> src/out/Default/args.gn
          [ -n "$GN_ARGS" ] && printf '%s\n' "$GN_ARGS" >> src/out/Default/args.gn
          cat src/out/Default/args.gn
          cd src && buildtools/linux64/gn gen out/Default

      # 原始碼只打包一次，後面每個 stage 都從這裡還原（tar 會保留時間戳，ninja 才不會全部重編）
      - name: Pack source
        if: inputs.stage == 1
        run: |
          mkdir -p pkg
          tar -cf - .gclient src | zstd -T0 -3 | split -b 1900M -d - pkg/src.tar.zst.
          ls -lh pkg
          df -h .

      - name: Upload source
        if: inputs.stage == 1
        uses: actions/upload-artifact@v4
        with:
          name: chromium-src
          path: pkg/
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Clean pack dir
        if: inputs.stage == 1
        run: rm -rf pkg

      # ---------- stage 2+：還原上一棒的進度 ----------

      - name: Download source
        if: inputs.stage > 1
        uses: actions/download-artifact@v4
        with:
          name: chromium-src
          path: pkg-src
          run-id: ${{ inputs.src_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Previous stage number
        id: prev
        if: inputs.stage > 1
        run: echo "n=$(( STAGE - 1 ))" >> "$GITHUB_OUTPUT"

      - name: Download previous out/
        if: inputs.stage > 1
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.out_name || format('chromium-out-{0}', steps.prev.outputs.n) }}
          path: pkg-out
          run-id: ${{ inputs.out_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore
        if: inputs.stage > 1
        run: |
          # 邊解壓邊刪掉讀完的分片，不然壓縮檔（約 17GB）和解開的原始碼會同時佔著磁碟
          for f in pkg-src/src.tar.zst.*; do cat "$f"; rm "$f"; done | zstd -d -T0 | tar -xf -
          rm -rf pkg-src
          for f in pkg-out/out.tar.zst.*; do cat "$f"; rm "$f"; done | zstd -d -T0 | tar -xf -
          rm -rf pkg-out
          df -h .

      - name: Install build deps
        if: inputs.stage > 1
        run: sudo src/build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts --no-syms --no-arm --no-nacl

      - name: Fixup
        if: inputs.stage > 1 && inputs.fixup != ''
        env:
          FIXUP: ${{ inputs.fixup }}
        run: |
          echo "$FIXUP"
          bash -euxo pipefail -c "$FIXUP"

      # ---------- 編譯 ----------

      - name: Build chrome_public_apk
        id: build
        run: |
          now=$(date +%s)
          remaining=$(( JOB_START + NINJA_DEADLINE_MIN * 60 - now ))
          echo "ninja 可用時間: $(( remaining / 60 )) 分鐘"
          if [ "$remaining" -lt 600 ]; then
            echo "時間不夠，直接交給下一棒"
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          timeout -s INT -k 180 "$remaining" \
            src/third_party/ninja/ninja -C src/out/Default -j 4 chrome_public_apk
          rc=$?
          set -e
          case $rc in
            0)       echo "done=true"  >> "$GITHUB_OUTPUT" ;;
            124|137) echo "時間到，交給下一棒"; echo "done=false" >> "$GITHUB_OUTPUT" ;;
            *)       echo "ninja 失敗 (exit $rc)"; exit $rc ;;
          esac

      # ---------- 沒編完：打包 out/ 給下一棒 ----------

      - name: Pack out/
        if: steps.build.outputs.done != 'true'
        run: |
          mkdir -p pkg
          tar -cf - src/out | zstd -T0 -1 | split -b 1900M -d - pkg/out.tar.zst.
          ls -lh pkg

      - name: Upload out/
        if: steps.build.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-out-${{ inputs.stage }}
          path: pkg/
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Fail if last stage did not finish
        if: steps.build.outputs.done != 'true' && inputs.last_stage
        run: |
          echo "最後一個 stage 也沒編完，請在 build-android.yml 多加幾個 stage"
          exit 1

      - name: Disk usage on failure
        if: failure()
        run: |
          df -h
          sudo du -xh -d 2 / 2>/dev/null | sort -h | tail -25 || true
          du -sh "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[a-z]* 2>/dev/null | sort -h || true

      # ---------- 編完：上傳 APK ----------

      - name: List APKs
        if: steps.build.outputs.done == 'true'
        run: ls -lh src/out/Default/apks/

      - name: Show compiler of libchrome.so
        if: steps.build.outputs.done == 'true'
        run: |
          f=src/out/Default/lib.unstripped/libchrome.so
          [ -f "$f" ] || f=src/out/Default/libchrome.so
          readelf -p .comment "$f" || true
          [ -f src/toolchain-report.md ] && cat src/toolchain-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload APK
        if: steps.build.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-android-${{ inputs.target_cpu }}-${{ inputs.version }}
          path: src/out/Default/apks/*.apk
          if-no-files-found: error
