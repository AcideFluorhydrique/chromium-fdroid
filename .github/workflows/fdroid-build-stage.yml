name: fdroid/build.sh in Debian (one stage)

# One relay stage of fdroid-build.yml. Stage 1 runs the recipe's sudo:
# commands, fdroid/build.sh prebuild, the scanner and build; later stages
# restore the previous stage's workspace and run build again, which continues
# ninja (build.sh skips what is configured already). A stage that does not
# finish packs the workspace for the next one.

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      version:
        type: string
        required: true
      cpu:
        type: string
        required: true
      toolchain_from:
        type: string
        required: false
        default: ""
      tools_from:
        type: string
        required: false
        default: ""
      scan:
        type: boolean
        required: false
        default: true
      ninja_minutes:
        description: "for testing the hand-over: stop ninja after this many minutes"
        type: string
        required: false
        default: ""
      dry_run:
        description: "test: configure, then only ninja -n (every input there?) and stop"
        type: boolean
        required: false
        default: false
      resume_from:
        description: "stage 1 only: owner/repo/run_id/artifact of a workspace another run packed, to continue that build"
        type: string
        required: false
        default: ""
    outputs:
      done:
        description: "true when this stage produced the APK"
        value: ${{ jobs.stage.outputs.done }}

jobs:
  stage:
    name: stage ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    outputs:
      done: ${{ steps.recipe.outputs.done }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        if: inputs.stage == 1 && inputs.resume_from == ''
        with:
          path: repo

      - name: Download toolchain and tools from earlier runs
        if: inputs.stage == 1 && inputs.resume_from == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TC_FROM: ${{ inputs.toolchain_from }}
          TOOLS_FROM: ${{ inputs.tools_from }}
        run: |
          mkdir -p tc tools
          i=0
          for s in $TC_FROM; do
            i=$((i + 1))
            # Artifacts expire; build.sh builds whatever part is missing.
            gh run download "${s##*/}" -R "${s%/*}" -p 'chromium-tc-*' -D "dl/$i" || echo "::warning::no toolchain artifacts in run ${s##*/}"
            mkdir -p "dl/$i"
            find "dl/$i" -name '*.tar.zst' -exec mv -f -t tc {} +
          done
          if [ -n "$TOOLS_FROM" ]; then
            gh run download "${TOOLS_FROM##*/}" -R "${TOOLS_FROM%/*}" -p 'tool-*' -D dl/tools || echo "::warning::no tools artifacts"
            mkdir -p dl/tools && find dl/tools -type f -exec mv -t tools {} +
          fi
          rm -rf dl
          ls -lh tc tools

      - name: Previous stage
        id: prev
        if: inputs.stage > 1
        run: echo "n=$((${{ inputs.stage }} - 1))" >> "$GITHUB_OUTPUT"

      - name: Download the previous stage's workspace
        if: inputs.stage > 1
        uses: actions/download-artifact@v4
        with:
          name: fdroid-recipe-work-${{ steps.prev.outputs.n }}
          path: pkg

      - name: Download a workspace another run packed
        if: inputs.stage == 1 && inputs.resume_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.resume_from }}
        run: |
          # owner/repo/run_id/artifact
          name=${FROM##*/}; rest=${FROM%/*}; run=${rest##*/}; repo=${rest%/*}
          gh run download "$run" -R "$repo" -n "$name" -D pkg
          ls -lh pkg

      - name: Restore the workspace
        if: inputs.stage > 1 || inputs.resume_from != ''
        run: |
          cat pkg/work.tar.zst.* | zstd -d -T0 | sudo tar -xpf - -C "$GITHUB_WORKSPACE"
          rm -rf pkg
          mkdir -p tc tools
          df -h /

      # The workspace holds the scripts of the run that packed it; a run that
      # resumes it uses its own (src/ and out/ are not tracked: only our files change).
      - name: Bring the restored checkout to this commit
        if: inputs.resume_from != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" repo
          git -C repo fetch -q --depth 1 "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C repo checkout -q -f FETCH_HEAD
          git -C repo log --oneline -1

      - name: Recipe in debian:trixie
        id: recipe
        env:
          # A stage 1 that resumes another run's workspace runs like a later stage.
          STAGE: ${{ inputs.resume_from == '' && inputs.stage || 0 }}
          VERSION: ${{ inputs.version }}
          CPU: ${{ inputs.cpu }}
          SCAN: ${{ inputs.scan }}
          NINJA_MINUTES: ${{ inputs.ninja_minutes }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          # Stop ninja 35 minutes before the job limit: packing and uploading
          # the workspace for the next stage took 10-12 minutes.
          deadline=$((JOB_START + 358 * 60 - 35 * 60))
          cat > inside.sh <<'INSIDE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          cd /w/repo
          apt-get update -q && apt-get install -y -q python3 python3-yaml
          # The recipe's sudo: commands and ndk:, as fdroidserver would run them.
          python3 - > /w/sudo.sh <<'PY'
          import yaml
          b = yaml.safe_load(open('fdroid/metadata/org.chromium.chrome.fdroid.yml'))['Builds'][-1]
          print('set -ex')
          print('\n'.join(b['sudo']))
          print(f"echo {b['ndk']} > /w/ndk-version")
          PY
          time bash /w/sudo.sh > /w/sudo.log 2>&1 || { tail -50 /w/sudo.log; exit 1; }
          # The build server has the NDK already; here it comes from sdkmanager,
          # once: it lives in the workspace and goes to the next stage with it, so
          # its files keep their times (a fresh copy would be newer than every
          # object file and ninja would compile everything for Android again).
          apt-get install -y -q sdkmanager python3-venv > /dev/null
          ndk=$(cat /w/ndk-version)
          # (F-Droid's sdkmanager reads ANDROID_HOME and ignores --sdk_root.)
          if [ ! -d "/w/android-sdk/ndk/$ndk" ]; then
            mkdir -p /w/android-sdk
            ANDROID_HOME=/w/android-sdk sdkmanager "ndk;$ndk" > /dev/null
          fi
          ls "/w/android-sdk/ndk/$ndk/source.properties"
          useradd -m builder
          chown -R builder /w
          run() { su builder -c "cd /w/repo && $*"; }
          if [ "$STAGE" = 1 ]; then
            echo "::group::prebuild"
            time run "ANDROID_NDK=/w/android-sdk/ndk/$ndk fdroid/build.sh prebuild $VERSION $CPU"
            echo "::endgroup::"
            if [ "$SCAN" = true ]; then
              echo "::group::scanner"
              run "python3 -m venv /w/fd && /w/fd/bin/pip install -q fdroidserver==2.4.5 \
                && /w/fd/bin/python -I .github/scripts/fdroid_scan.py src /w/scan --ignore fdroid/scanignore.txt" \
                || echo "scanner failed"
              rm -rf /w/fd
              echo "::endgroup::"
            fi
          fi
          echo "::group::build"
          limit=""
          [ -z "$NINJA_MINUTES" ] || limit="NINJA_TIMEOUT=$((NINJA_MINUTES * 60))"
          [ -z "$DRY_RUN" ] || limit="$limit NINJA_DRY_RUN=1"
          time run "ANDROID_NDK=/w/android-sdk/ndk/$ndk TOOLCHAIN_PKG=/w/tc TOOLS_PKG=/w/tools \
            NINJA_DEADLINE=$DEADLINE $limit fdroid/build.sh build $VERSION $CPU"
          echo "::endgroup::"
          INSIDE
          rc=0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -e STAGE -e VERSION -e CPU -e SCAN -e NINJA_MINUTES -e DRY_RUN \
            -e DEADLINE="$deadline" debian:trixie bash /w/inside.sh || rc=$?
          # The container made its builder user the owner of the whole workspace,
          # its root included; give it back to the runner for the steps after.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          [ "$rc" = 0 ] || exit "$rc"
          if [ -n "$DRY_RUN" ]; then
            echo "dry run: no APK, no next stage"
            echo "done=true" >> "$GITHUB_OUTPUT"
          elif [ -f repo/fdroid-out/ChromePublic-unsigned.apk ]; then
            ls -l repo/fdroid-out
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "ninja stopped at the deadline; the next stage continues"
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          [ -f scan/summary.md ] && cat scan/summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f repo/src/toolchain-report.md ] && cat repo/src/toolchain-report.md >> "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Pack the workspace for the next stage
        if: steps.recipe.outputs.done == 'false'
        run: |
          # The container's builder user owns everything under the workspace.
          sudo rm -rf tc tools
          mkdir -p pkg
          sudo tar -cpf - repo android-sdk | zstd -T0 -3 | split -b 1900M -d - pkg/work.tar.zst.
          sudo rm -rf repo android-sdk
          ls -lh pkg

      - uses: actions/upload-artifact@v4
        if: steps.recipe.outputs.done == 'false'
        with:
          name: fdroid-recipe-work-${{ inputs.stage }}
          path: pkg/
          retention-days: 2
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always() && (inputs.stage == 1 || steps.recipe.outputs.done == 'true')
        with:
          name: fdroid-recipe-${{ inputs.version }}-${{ inputs.cpu }}-stage${{ inputs.stage }}
          path: |
            scan/
            repo/fdroid-out/
          if-no-files-found: ignore
