name: Build Chromium Android for F-Droid tests

# 免費 runner 單一 job 最多 6 小時，編不完 Chromium。
# 所以拆成多個 stage 接力：每個 stage 編到快超時就停，把進度打包成 artifact，
# 下一個 stage 下載後讓 ninja 從中斷的地方繼續。編完的那個 stage 會直接上傳 APK，
# 後面的 stage 自動跳過。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chromium 版本 tag，例如 142.0.7444.171（留空 = 最新 Android Stable）"
        required: false
        default: ""
        type: string
      target_cpu:
        description: "CPU 架構"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64   # 一般手機
          - arm     # 舊款 32 位元手機
          - x64     # 模擬器
      package_name:
        description: "APK 包名（預設和正式發布的不同，可以同時安裝）"
        required: true
        default: "org.chromium.chrome.fdroidtest"
        type: string
      official:
        description: "官方等級最佳化（is_official_build，照 uazo Vanilla 的設定；實驗中）"
        required: false
        default: false
        type: boolean
      own_toolchain:
        description: "clang / rust / gn / ninja / node 自己從原始碼編，不用 Google 預編譯的"
        required: false
        default: true
        type: boolean
      toolchain_from:
        description: "直接用之前 run 編好的工具鏈：owner/repo/run_id，可以填好幾個（空白分隔，後面的優先）；留空 = 重新編，約 2.5 小時"
        required: false
        default: ""
        type: string
      rebuild_only:
        description: "配合 toolchain_from：其中哪些要重編（clang、rust、tools，逗號分隔；留空 = 全部沿用）"
        required: false
        default: ""
        type: string
      variant:
        description: "gms_variant.py 的設定，例如 F-Droid 組合：stubs genstubs gms=microg drop=playcore,mlkit,impress gnargs patch=cast,shape,castoff,status,fido；留空 = 不改"
        required: false
        default: ""
        type: string
      fdroid_tree:
        description: "F-Droid 的原始碼處理：不同步 skip-deps.txt 的 DEPS、prune_binaries.py、NDK 用 sdkmanager"
        required: false
        default: false
        type: boolean
      gn_args:
        description: "額外的 GN args，接在 args.gn 最後，例如 use_sysroot = false（實驗用）"
        required: false
        default: ""
        type: string
      # 一次完整的編譯要 12 小時以上。如果只是最後幾步壞掉（R8、打包），不用重頭來：
      # 從那個 run 的 chromium-src 和某一棒的 out/ artifact 接著編，用 fixup 改掉 src 裡
      # 有問題的檔案，ninja 只會重做受影響的步驟。artifact 只保留 3 天。
      resume_from:
        description: "接著編：之前的 run id（填了就跳過工具鏈和 stage 1；version / target_cpu 要和那個 run 一樣）"
        required: false
        default: ""
        type: string
      resume_out:
        description: "接著編：從哪個 out/ artifact 開始，例如 chromium-out-2"
        required: false
        default: ""
        type: string
      fixup:
        description: "接著編：ninja 之前在 workspace 執行的 bash，例如 sed -i ... src/fdroid_gms/microg-proguard.txt"
        required: false
        default: ""
        type: string

# 從別的 run 下載工具鏈 artifact 需要 actions: read
permissions:
  actions: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v=$(curl -fsSL "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1" | jq -r '.[0].version')
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本格式不對: '$v'"; exit 1
          fi
          if ! [[ "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "包名格式不對: '$PACKAGE_NAME'"; exit 1
          fi
          echo "Chromium $v ($PACKAGE_NAME)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  toolchain:
    needs: resolve
    if: inputs.resume_from == '' && inputs.own_toolchain && (inputs.toolchain_from == '' || inputs.rebuild_only != '')
    uses: ./.github/workflows/toolchain.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      components: ${{ inputs.toolchain_from == '' && 'clang,rust,tools' || inputs.rebuild_only }}

  stage1:
    needs: [resolve, toolchain]
    if: ${{ !cancelled() && inputs.resume_from == '' && needs.resolve.result == 'success' && (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped') }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 1
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}
      own_toolchain: ${{ inputs.own_toolchain || false }}
      toolchain_from: ${{ inputs.toolchain_from }}
      rebuild_only: ${{ inputs.rebuild_only }}
      variant: ${{ inputs.variant }}
      gn_args: ${{ inputs.gn_args }}
      fdroid_tree: ${{ inputs.fdroid_tree || false }}

  stage2:
    needs: [resolve, stage1]
    if: ${{ !cancelled() && needs.stage1.result == 'success' && needs.stage1.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 2
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}

  stage3:
    needs: [resolve, stage2]
    if: ${{ !cancelled() && needs.stage2.result == 'success' && needs.stage2.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 3
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}

  stage4:
    needs: [resolve, stage3]
    if: ${{ !cancelled() && needs.stage3.result == 'success' && needs.stage3.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 4
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}

  stage5:
    needs: [resolve, stage4]
    if: ${{ !cancelled() && needs.stage4.result == 'success' && needs.stage4.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 5
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}

  stage6:
    needs: [resolve, stage5]
    if: ${{ !cancelled() && needs.stage5.result == 'success' && needs.stage5.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 6
      last_stage: true
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}

  # ---------- resume_from：從別的 run 接著編 ----------
  # stage 編號從 11 開始，out/ artifact 才不會和原本 run 的 chromium-out-N 混在一起。
  # fixup 每一棒都要重跑，因為 chromium-src artifact 不會更新。

  resume11:
    needs: resolve
    if: ${{ inputs.resume_from != '' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 11
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}
      src_run: ${{ inputs.resume_from }}
      out_run: ${{ inputs.resume_from }}
      out_name: ${{ inputs.resume_out }}
      fixup: ${{ inputs.fixup }}

  resume12:
    needs: [resolve, resume11]
    if: ${{ !cancelled() && needs.resume11.result == 'success' && needs.resume11.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 12
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}
      src_run: ${{ inputs.resume_from }}
      fixup: ${{ inputs.fixup }}

  resume13:
    needs: [resolve, resume12]
    if: ${{ !cancelled() && needs.resume12.result == 'success' && needs.resume12.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with:
      stage: 13
      last_stage: true
      version: ${{ needs.resolve.outputs.version }}
      target_cpu: ${{ inputs.target_cpu }}
      package_name: ${{ inputs.package_name }}
      official: ${{ inputs.official || false }}
      src_run: ${{ inputs.resume_from }}
      fixup: ${{ inputs.fixup }}
