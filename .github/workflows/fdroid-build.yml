name: Try fdroid/build.sh in Debian

# Runs the fdroiddata recipe in fdroid/metadata the way F-Droid's build server
# would, as far as one 6-hour job allows: a debian:trixie container, the
# recipe's sudo: commands as root, the NDK from sdkmanager, then
# fdroid/build.sh prebuild and build as an unprivileged user, with
# fdroidserver's scanner in between.
#
# To fit in the job, build takes the toolchain and the tools built from source
# from earlier runs (the same scripts built them) and ninja stops before the
# job's time runs out. What this checks: the Debian packages are enough, no
# step needs root, prebuild works, what the scanner still flags, and that
# build gets through gn gen into ninja.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chromium 版本（要有 reports/<version>/prune-list.txt.gz）"
        required: false
        default: "158.0.8127.36"
        type: string
      cpu:
        description: "arm、arm64 或 x64"
        required: false
        default: "arm64"
        type: string
      toolchain_from:
        description: "工具鏈 artifact（chromium-tc-*）的 run，空白分隔 owner/repo/run_id，後面的蓋過前面的"
        required: false
        default: "AcideFluorhydrique/chromium-fdroid/43426073206 AcideFluorhydrique/chromium-fdroid/43573902951 AcideFluorhydrique/chromium-fdroid/43711783516"
        type: string
      tools_from:
        description: "tools-from-source 的 run（tool-* artifact）"
        required: false
        default: "AcideFluorhydrique/chromium-fdroid/44573113946"
        type: string
      scan:
        description: "prebuild 之後跑 fdroidserver 的 scanner"
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Download toolchain and tools from earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          TC_FROM: ${{ inputs.toolchain_from }}
          TOOLS_FROM: ${{ inputs.tools_from }}
        run: |
          mkdir -p tc tools
          i=0
          for s in $TC_FROM; do
            i=$((i + 1))
            gh run download "${s##*/}" -R "${s%/*}" -p 'chromium-tc-*' -D "dl/$i"
            find "dl/$i" -name '*.tar.zst' -exec mv -f -t tc {} +
          done
          gh run download "${TOOLS_FROM##*/}" -R "${TOOLS_FROM%/*}" -p 'tool-*' -D dl/tools
          find dl/tools -type f -exec mv -t tools {} +
          rm -rf dl
          ls -lh tc tools

      - name: Recipe in debian:trixie
        env:
          VERSION: ${{ inputs.version }}
          CPU: ${{ inputs.cpu }}
          SCAN: ${{ inputs.scan }}
        run: |
          # Stop ninja 25 minutes before the job limit, for the summary and cleanup.
          deadline=$((JOB_START + 358 * 60 - 25 * 60))
          cat > inside.sh <<'INSIDE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          cd /w/repo
          apt-get update -q && apt-get install -y -q python3 python3-yaml
          # The recipe's sudo: commands and ndk:, as fdroidserver would run them.
          python3 - > /w/sudo.sh <<'PY'
          import yaml
          b = yaml.safe_load(open('fdroid/metadata/org.chromium.chrome.fdroid.yml'))['Builds'][-1]
          print('set -ex')
          print('\n'.join(b['sudo']))
          print(f"echo {b['ndk']} > /w/ndk-version")
          PY
          cat /w/sudo.sh
          time bash /w/sudo.sh
          # The build server has the NDK already; here it comes from sdkmanager.
          apt-get install -y -q sdkmanager python3-venv
          ndk=$(cat /w/ndk-version)
          sdkmanager --sdk_root=/opt/android-sdk "ndk;$ndk" > /dev/null
          useradd -m builder
          chown -R builder /w
          run() { su builder -c "cd /w/repo && $*"; }
          echo "::group::prebuild"
          time run "ANDROID_NDK=/opt/android-sdk/ndk/$ndk fdroid/build.sh prebuild $VERSION $CPU"
          echo "::endgroup::"
          if [ "$SCAN" = true ]; then
            echo "::group::scanner"
            run "python3 -m venv /w/fd && /w/fd/bin/pip install -q fdroidserver==2.4.5 \
              && /w/fd/bin/python -I .github/scripts/fdroid_scan.py src /w/scan --ignore fdroid/scanignore.txt" \
              || echo "scanner failed"
            echo "::endgroup::"
          fi
          echo "::group::build"
          time run "ANDROID_NDK=/opt/android-sdk/ndk/$ndk TOOLCHAIN_PKG=/w/tc TOOLS_PKG=/w/tools \
            NINJA_DEADLINE=$DEADLINE fdroid/build.sh build $VERSION $CPU"
          echo "::endgroup::"
          ls -l fdroid-out 2>/dev/null || echo "no APK (ninja stopped at the deadline)"
          INSIDE
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -e VERSION -e CPU -e SCAN -e DEADLINE="$deadline" \
            debian:trixie bash /w/inside.sh

      - name: Summary
        if: always()
        run: |
          [ -f scan/summary.md ] && cat scan/summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f repo/src/toolchain-report.md ] && cat repo/src/toolchain-report.md >> "$GITHUB_STEP_SUMMARY"
          df -h /

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdroid-recipe-${{ inputs.version }}-${{ inputs.cpu }}
          path: |
            scan/
            repo/fdroid-out/
          if-no-files-found: ignore
