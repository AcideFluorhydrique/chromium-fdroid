MaintainerNotes: |-
  Vanilla Chromium with only the changes F-Droid's inclusion policy needs
  (fdroiddata#3911): androidx releases from Google Maven, microG in place of
  Play services, signature-only stubs for the remaining Google libraries,
  Play Core / ML Kit / Impress removed, a few small patches. Everything is
  done by fdroid/build.sh in the Repo; its GitHub Actions run the same
  script in debian:trixie with this recipe's sudo: commands.

  prebuild (what the scanner sees): chromium/src at the version tag, then
  gclient sync without
  - the DEPS chrome_public_apk does not need (fdroid/skip-deps.txt), and
  - the DEPS build provides itself (fdroid/replaced-deps.txt): Google's
    sysroots, clang, Rust, libclang, GN, Ninja, Node, clang-format, the JDK,
    the Android SDK, kotlinc, r8, turbine, aapt2, protoc, gperf and the
    Java build tools (error_prone, nullaway, manifest_merger, signflinger,
    ijar, dx, the system SDK stubs).
  Both lists are cut out of src/DEPS (fdroid/skip_deps.py): custom_deps =
  None only skips git dependencies, not CIPD/GCS ones. Then it deletes the
  flagged files the build never reads (fdroid/prune_binaries.py with
  reports/<version>/prune-list.txt.gz), the files build replaces
  (fdroid/replaced-files.txt), the Gradle files GN never reads, and the
  .aar/.jar files of the androidx and android_deps CIPD packages (synced
  for their BUILD.gn, licenses and .info files).

  build: clang, Rust, GN, Ninja and Node built from source with Debian's
  compilers; gperf, esbuild, tsc, rollup's wasm and Dawn's Go from source;
  Debian's OpenJDK; the SDK platform and build tools from sdkmanager
  (fdroid/sdk_install.py, also for platforms sdkmanager cannot parse,
  sha256 from F-Droid's transparency log); androidx and android_deps from
  Google Maven / Maven Central (fdroid/maven_libs.py; Play services,
  Firebase, ML Kit, ARCore and other non-free groups are never fetched,
  they get empty placeholder aars because gn gen reads every aar);
  r8, turbine, aapt2, protoc and kotlinc from Maven; error_prone, javac,
  nullaway, manifest_merger and signflinger as Chromium's 3pp scripts make
  them (mvn jar-with-dependencies); ijar from Bazel's source, dx from AOSP's,
  the system API stubs from AOSP prebuilts/sdk (fdroid/java_tools.py).
  Versions of what was CIPD-only come from reports/<version>/cipd-pins.json.
  Then gn gen, ninja and an unsigned copy of the APK (fdroid/unsign_apk.py;
  Chromium signs it with its debug key).

  The build takes about 20 hours on 4 cores.

  Version codes are Chromium's own (build/util/android_chrome_version.py):
  BUILD * 100000 + PATCH * 100 + ABI digit, ABI 00 = arm, 04 = arm64,
  09 = x64. Example: 158.0.8127.36 arm64 = 812703604.

  New versions: https://chromiumdash.appspot.com/releases?platform=Android
  (Stable). The Repo needs reports/<version>/prune-list.txt.gz (scan.yml)
  and reports/<version>/cipd-pins.json (sync-trim.yml) for each version.

  NDK version: grep android_ndk_version src/DEPS

  Scanner: microG's com.google.android.gms classes and the stubs in
  fdroid/stubs are expected (they replace Play services). The scanignore
  entries are data or source files the build reads (reasons in
  fdroid/scanignore.txt in the Repo).

