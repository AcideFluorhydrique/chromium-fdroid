name: Scan Chromium source with fdroid scanner

# 照 F-Droid 編譯伺服器的規則（fdroidserver 的 scanner）掃一遍 gclient sync 完的 Chromium 原始碼，
# 列出預編譯的二進位檔、jar/aar、.so 和 Play 服務等不開源的依賴。不編譯，只佔一個 job。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chromium 版本 tag（留空 = 最新 Android Stable）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v=$(curl -fsSL "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=1" | jq -r '.[0].version')
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本格式不對: '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Chromium $v"

      # 新版 runner 映像只有一顆碟，清掉用不到的東西，根目錄約有 110GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github/scripts

      - name: Get depot_tools
        run: |
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch chromium/src at tag
        run: |
          git init -q src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          for i in 1 2 3 4; do git fetch -q --depth 1 origin "refs/tags/$VERSION" && break; echo "fetch 失敗，$((i * 60)) 秒後重試 ($i/4)"; sleep $((i * 60)); done
          git checkout -q FETCH_HEAD

      - name: gclient sync
        run: |
          cat > .gclient <<'GCLIENT'
          solutions = [{
            "name": "src",
            "url": "https://chromium.googlesource.com/chromium/src.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {},
          }]
          target_os = ["android"]
          GCLIENT
          gclient sync --no-history -j 8
          du -sh src

      # 用 chrome_public_apk 的編譯圖（不編譯）判斷哪些被標記的檔案真的會被編譯用到
      - name: Install build deps
        run: sudo src/build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts --no-syms --no-arm --no-nacl

      - name: Build graph inputs of chrome_public_apk
        run: |
          mkdir -p src/out/Default
          cat > src/out/Default/args.gn <<'ARGS'
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_component_build = false
          symbol_level = 0
          treat_warnings_as_errors = false
          android_static_analysis = "off"
          use_siso = false
          ARGS
          (cd src && buildtools/linux64/gn gen out/Default)
          src/third_party/ninja/ninja -C src/out/Default -t inputs chrome_public_apk > build-inputs.txt
          wc -l build-inputs.txt
          rm -rf src/out

      - name: Install fdroidserver
        run: |
          python3 -m venv fd
          fd/bin/pip install -q fdroidserver==2.4.5

      - name: Scan
        run: fd/bin/python -I ci/.github/scripts/fdroid_scan.py src "scan-$VERSION"

      - name: Generate scandelete rules
        run: python3 -I ci/.github/scripts/scan_rules.py "scan-$VERSION/findings.tsv" build-inputs.txt "scan-$VERSION"

      # 照 F-Droid 編譯伺服器的做法套用規則（刪掉規則底下被標記的檔案）再掃一次，看還剩什麼
      - name: Scan again with the rules
        run: fd/bin/python -I ci/.github/scripts/fdroid_scan.py src "scan-$VERSION/after-rules" --rules "scan-$VERSION/scan-rules.txt"

      # 報告直接存進 repo 的 reports/<版本>/，方便大家在 GitHub 上看，也不怕 artifact 服務出問題
      - name: Commit report
        run: |
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          d="repo/reports/$VERSION"
          mkdir -p "$d"
          cp "scan-$VERSION/summary.md" "$d/fdroid-scan.md"
          gzip -9c "scan-$VERSION/findings-build.tsv" > "$d/fdroid-scan-findings.tsv.gz"
          cp "scan-$VERSION/scan-rules.txt" "$d/scan-rules.txt"
          cp "scan-$VERSION/build-graph.md" "$d/build-graph.md"
          cp "scan-$VERSION/after-rules/summary.md" "$d/fdroid-scan-after-rules.md"
          gzip -9c "scan-$VERSION/after-rules/findings.tsv" > "$d/fdroid-scan-after-rules-findings.tsv.gz"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -q -m "Add fdroid scanner report for Chromium $VERSION" || { echo "沒有變化"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fdroid-scan-${{ env.VERSION }}
          path: scan-${{ env.VERSION }}/
          retention-days: 90
