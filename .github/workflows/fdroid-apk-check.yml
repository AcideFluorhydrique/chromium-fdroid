name: Check the unsigned APK from fdroid-build

# What F-Droid does with the recipe's output: the APK must be unsigned,
# zip-aligned, have the expected application id and version code, and sign
# and verify with apksigner. Also lists what takes the space in it.

on:
  push:
    branches: [test/nifty-hypatia-c9t1lq]
    paths: [.github/workflows/fdroid-apk-check.yml]
  workflow_dispatch:
    inputs:
      run:
        description: "fdroid-build 的 run id"
        required: false
        default: "45105903227"
        type: string
      artifact:
        description: "APK 所在的 artifact"
        required: false
        default: "fdroid-recipe-158.0.8127.36-arm64-stage4"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run || '45105903227' }}
          ARTIFACT: ${{ inputs.artifact || 'fdroid-recipe-158.0.8127.36-arm64-stage4' }}
        run: |
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D dl
          apk=$(find dl -name 'ChromePublic-unsigned.apk' | head -1)
          [ -n "$apk" ] || { find dl; exit 1; }
          mv "$apk" unsigned.apk

      - name: Check
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"
          {
            echo "## Unsigned APK"
            echo
            echo "- size: $(stat -c %s unsigned.apk) bytes, sha256 \`$(sha256sum unsigned.apk | cut -c1-16)\`"
            badging=$("$bt/aapt2" dump badging unsigned.apk)
            echo "- $(echo "$badging" | grep -m1 '^package:')"
            echo "- $(echo "$badging" | grep -m1 '^sdkVersion:') $(echo "$badging" | grep -m1 '^targetSdkVersion:')"
            echo "- $(echo "$badging" | grep -m1 '^native-code:')"
            echo "- $(echo "$badging" | grep -m1 "^application-label:")"
            sig=$(unzip -Z1 unsigned.apk | grep -E '^META-INF/.*\.(SF|RSA|DSA|EC)$|^META-INF/MANIFEST\.MF$' || true)
            echo "- v1 signature files: ${sig:-none}"
            if "$bt/apksigner" verify unsigned.apk > verify-unsigned.txt 2>&1; then
              echo "- apksigner verify: **signed** (unexpected)"; bad=1
            else
              echo "- apksigner verify: not signed ($(head -1 verify-unsigned.txt))"
            fi
            if "$bt/zipalign" -c -P 16 -v 4 unsigned.apk > zipalign.txt 2>&1; then
              echo "- zipalign -c -P 16 4: ok"
            else
              echo "- zipalign -c -P 16 4: **FAILED**"; tail -5 zipalign.txt | sed 's/^/  /'; bad=1
            fi
            # Sign it with a throwaway key the way F-Droid signs with its own.
            keytool -genkeypair -keystore t.jks -storepass android -keypass android -alias t \
              -keyalg RSA -keysize 2048 -validity 1 -dname CN=test > /dev/null 2>&1
            cp unsigned.apk signed.apk
            "$bt/apksigner" sign --ks t.jks --ks-pass pass:android signed.apk
            if "$bt/apksigner" verify --verbose signed.apk > verify.txt 2>&1; then
              echo "- signed with a test key: apksigner verify ok ($(grep -E 'v[234] scheme.*true' verify.txt | tr '\n' ' '))"
            else
              echo "- signed with a test key: **verify FAILED**"; bad=1
            fi
            echo
            echo "### Largest entries"
            echo
            echo '| bytes | compressed | method | name |'
            echo '|---:|---:|---|---|'
            unzip -v unsigned.apk | awk 'NR>3 && $1 ~ /^[0-9]+$/ && NF>=8 {print $1, $3, $2, $8}' \
              | sort -rn | head -15 | awk '{printf "| %s | %s | %s | `%s` |\n", $1, $2, $3, $4}'
            echo "${bad:+FAILED}" > result
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ ! -s result ] || [ "$(cat result)" != FAILED ]
