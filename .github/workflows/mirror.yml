name: Mirror to HydrofluoricLab

# 每次 push（任何分支或 tag）或刪除分支/tag，就把所有分支和 tag 同步到
# https://github.com/HydrofluoricLab/chromium-fdroid
# 需要 repo secret：MIRROR_TOKEN（對目標 repo 有 Contents + Workflows 讀寫權限的 fine-grained PAT）

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    # 只在來源 repo 執行，避免鏡像那邊也跑這個 workflow
    if: github.repository == 'AcideFluorhydrique/chromium-fdroid'
    runs-on: ubuntu-24.04
    steps:
      - name: Push all branches and tags to mirror
        env:
          SRC_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          SRC: https://github.com/${{ github.repository }}.git
          DST: https://github.com/HydrofluoricLab/chromium-fdroid.git
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::缺少 secret MIRROR_TOKEN"; exit 1
          fi
          git init --bare src.git
          cd src.git
          src_auth=$(printf 'x-access-token:%s' "$SRC_TOKEN" | base64 -w0)
          dst_auth=$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic ${src_auth}" \
            fetch --prune "$SRC" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          # 只推 heads 和 tags（refs/pull/* 是 GitHub 唯讀 ref，推不上去）
          git -c http.extraheader="Authorization: Basic ${dst_auth}" \
            push --prune --force "$DST" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
