name: Test APKs in an emulator

# 在 GitHub runner 的 Android 模擬器（KVM）裡裝 APK、截圖 設定→隱私和安全性 和 Reader mode
# （直的、轉 90 度各一次；profiles 可以一次測多種螢幕大小）、收 logcat，
# 結果推到 emulator-results 分支（截圖可以直接在 GitHub 上看）。
# x86_64 映像檔內建 ARM 轉譯，可以跑我們的 arm64 APK。

on:
  workflow_dispatch:
    inputs:
      apks:
        description: "空白分隔的 label=來源。來源是本 repo 的 run id、owner/repo/run_id、release:owner/repo（最新 release 的 arm64 APK），或 recipe:<fdroid-build 的 run id>（未簽名的 APK，用測試金鑰簽）"
        required: true
        type: string
      api_level:
        description: "Android API level"
        required: false
        default: "35"
        type: string
      target:
        description: "google_apis = 有 Play 服務；default = 純 AOSP，沒有任何 Google 服務（像 GSI）"
        required: false
        default: "google_apis"
        type: choice
        options: [google_apis, default]
      microg:
        description: "先裝 microG GmsCore（配 target=default，測有 microG 的情況）"
        required: false
        default: false
        type: boolean
      runner:
        description: "ubuntu-24.04 = x86_64 模擬器（測 x64 APK）；ubuntu-24.04-arm = 試試 arm64 模擬器（需要 /dev/kvm）"
        required: false
        default: "ubuntu-24.04"
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm]
      profiles:
        description: "空白分隔的 AVD 裝置設定，每個開一個平行的 job，例如 pixel_6 medium_tablet pixel_tablet（avdmanager list device 的 id；runner 上沒有 pixel_fold。螢幕寬度不同，設定頁的排版也不同）"
        required: false
        default: "pixel_6"
        type: string
      capture:
        description: "錄下模擬器的網路流量（-tcpdump），加上 Chromium 的 NetLog，列出每個 APK 連了哪些主機（traffic.md）"
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  profiles:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        env:
          PROFILES: ${{ inputs.profiles }}
        run: echo "list=$(printf '%s\n' ${PROFILES:-pixel_6} | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  test:
    needs: profiles
    name: test (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.list) }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        env:
          GH_TOKEN: ${{ github.token }}
          APKS: ${{ inputs.apks }}
        run: |
          mkdir -p apks
          for item in $APKS; do
            label=${item%%=*} src=${item#*=}
            d=dl/$label
            mkdir -p "$d"
            case "$src" in
              release:*) gh release download -R "${src#release:}" -p '*arm64*.apk' -D "$d" ;;
              recipe:*)
                # fdroid-build.yml's unsigned APK, signed with a throwaway key
                # the way F-Droid signs it with its own.
                gh run download "${src#recipe:}" -R "$GITHUB_REPOSITORY" -p 'fdroid-recipe-[0-9]*' -D "$d"
                u=$(find "$d" -name 'ChromePublic-unsigned.apk' | head -1)
                [ -n "$u" ] || { echo "no unsigned APK in run ${src#recipe:}"; find "$d"; exit 1; }
                bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
                keytool -genkeypair -keystore "$d/t.jks" -storepass android -keypass android -alias t \
                  -keyalg RSA -keysize 2048 -validity 1 -dname CN=test > /dev/null 2>&1
                "$bt/apksigner" sign --ks "$d/t.jks" --ks-pass pass:android --out "$d/signed.apk" "$u"
                rm "$u" ;;
              */*/*) gh run download "${src##*/}" -R "${src%/*}" -p 'chromium-android-*' -D "$d" ;;
              *) gh run download "$src" -R "$GITHUB_REPOSITORY" -p 'chromium-android-*' -D "$d" ;;
            esac
            apk=$(find "$d" -name '*.apk' ! -name '*.apks' | grep -v -- '-unsigned' | head -1)
            [ -n "$apk" ] || { echo "no APK for $item"; find "$d"; exit 1; }
            mv "$apk" "apks/$label.apk"
          done
          rm -rf dl
          ls -la apks

      - name: Download microG
        if: inputs.microg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p microg
          gh release download -R microg/GmsCore -p 'com.google.android.gms-*.apk' -D microg
          ls microg
          f=$(ls microg/*.apk | grep -v -- '-hw' | head -1)
          mv "$f" microg/gmscore.apk

      - name: Check KVM
        run: |
          echo "host: $(uname -m)"
          ls -l /dev/kvm || { echo "::error::no /dev/kvm on ${{ inputs.runner }}: the Android emulator cannot use hardware acceleration here"; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.runner == 'ubuntu-24.04-arm' && 'arm64-v8a' || 'x86_64' }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 8G
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ inputs.capture && format('-tcpdump {0}/traffic.pcap', github.workspace) || '' }}
          script: export IDLE_SECONDS=${{ inputs.capture && '180' || '20' }}; if [ -f microg/gmscore.apk ]; then adb install -r -g microg/gmscore.apk && adb shell pm list packages | grep -i gms; fi; for apk in apks/*.apk; do l=$(basename "$apk" .apk); python3 .github/scripts/emulator_test.py "$apk" "$l" "results/$l" || echo "test of $l failed"; done

      - name: Hosts contacted
        if: always() && inputs.capture
        run: |
          [ -d results ] || exit 0
          python3 -I .github/scripts/traffic_hosts.py traffic.pcap results
          cat results/traffic.md >> "$GITHUB_STEP_SUMMARY"
          [ -f traffic.pcap ] && gzip -9c traffic.pcap > results/traffic.pcap.gz || true

      - name: Push results to the emulator-results branch
        if: always()
        run: |
          [ -d results ] || exit 0
          dest="runs/${{ github.run_id }}-api${{ inputs.api_level }}-${{ inputs.target }}${{ inputs.microg && '-microg' || '' }}-${{ matrix.profile }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" -b emulator-results res 2>/dev/null \
            || { git init -q res && cd res && git checkout -q -b emulator-results && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" && cd ..; }
          mkdir -p "res/$dest"
          cp -r results/* "res/$dest/"
          gzip -9 "res/$dest"/*/logcat.txt "res/$dest"/*/netlog.json || true
          cd res
          git add -A
          git commit -q -m "Emulator results for run ${{ github.run_id }} (API ${{ inputs.api_level }}, ${{ matrix.profile }})"
          for i in 1 2 3; do git push -q origin emulator-results && break; git pull -q --rebase origin emulator-results; done
          echo "https://github.com/${{ github.repository }}/tree/emulator-results/$dest" >> "$GITHUB_STEP_SUMMARY"
